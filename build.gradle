plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

version = '0.2.0-dev-mc26.2'
group = 'dev.mcai.companion'
base.archivesName = 'mcai_companion'

def forgeCompileVersion = providers.gradleProperty(
    'forge_compile_version'
).getOrElse('65.0.0')

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    useDefaultAccessTransformer()
    // ForgeGradle 7 does not forward Gradle's offline flag to Mavenizer.
    if (gradle.startParameter.offline) mavenizerArguments.addAll('--offline', '--cache-only')

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir(
                providers.gradleProperty('minepilot_run_dir').getOrElse('run'))
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args '--mixin', 'mcai_companion.mixins.json'
        }

        register('client') {
            if (System.getProperty('os.name')
                    .toLowerCase(java.util.Locale.ROOT)
                    .contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            def liveModelGate = Boolean.parseBoolean(
                System.getProperty('minepilot.liveNavigationTest', 'false'))
            def codexSkillGate = Boolean.parseBoolean(
                System.getProperty('minepilot.codexSkillTest', 'false'))
            def repairGate = Boolean.parseBoolean(
                System.getProperty('minepilot.navigationRepairTest', 'false'))
            def knowledgeGate = Boolean.parseBoolean(System.getProperty('minepilot.knowledgeTest', 'false'))
            def soundGate = Boolean.parseBoolean(System.getProperty('minepilot.soundTest', 'false'))
            def followGate = Boolean.parseBoolean(System.getProperty('minepilot.followTest', 'false'))
            def placementGate = Boolean.parseBoolean(System.getProperty('minepilot.placementTest', 'false'))
            def collectionGate = Boolean.parseBoolean(System.getProperty('minepilot.collectionTest', 'false'))
            def miningGate = Boolean.parseBoolean(System.getProperty('minepilot.miningTest', 'false'))
            def persistenceGate = Boolean.parseBoolean(System.getProperty('minepilot.persistenceTest', 'false'))
            def respawnGate = Boolean.parseBoolean(System.getProperty('minepilot.respawnTest', 'false'))
            def dropGate = Boolean.parseBoolean(System.getProperty('minepilot.dropTest', 'false'))
            def provenanceGate = Boolean.parseBoolean(System.getProperty('minepilot.provenanceTest', 'false'))
            def excavationGate = Boolean.parseBoolean(System.getProperty('minepilot.excavationTest', 'false'))
            def resourceWaterGate = Boolean.parseBoolean(System.getProperty('minepilot.resourceWaterTest', 'false'))
            def campGate = Boolean.parseBoolean(System.getProperty('minepilot.campTest', 'false'))
            def survivalGate = Boolean.parseBoolean(System.getProperty('minepilot.survivalTest', 'false'))
            def playGate = Boolean.parseBoolean(System.getProperty('minepilot.playExperienceTest', 'false'))
            def structureGate = Boolean.parseBoolean(System.getProperty('minepilot.structureTest', 'false'))
            if ([respawnGate, liveModelGate, codexSkillGate, repairGate, knowledgeGate, soundGate, followGate, miningGate, collectionGate, placementGate, persistenceGate, structureGate, excavationGate, provenanceGate, dropGate, playGate, survivalGate, resourceWaterGate, campGate].count { it } > 1) {
                throw new GradleException(
                    'Enable only one MinePilot external black-box gate per run')
            }
            def selectedTest = persistenceGate ? 'mcai_companion:headless_saved_player_restoration' : placementGate ? 'mcai_companion:placement_tool_regressions' : collectionGate ? 'mcai_companion:collection_tool_regressions' : miningGate ? 'mcai_companion:mining_tool_regressions' : followGate ? 'mcai_companion:continuous_follow_regressions' : soundGate ? 'mcai_companion:sound_tool_regressions' : knowledgeGate ? 'mcai_companion:knowledge_tool_regressions' : repairGate
                ? 'mcai_companion:navigation_repair_regressions'
                : codexSkillGate
                ? 'mcai_companion:codex_skill_chat_navigation_blackbox'
                : liveModelGate
                    ? 'mcai_companion:live_model_chat_navigation_blackbox'
                    : 'mcai_companion:headless_control_frame_displacement'
            systemProperty 'forge.enabledGameTestNamespaces', 'mcai_companion'
            if (resourceWaterGate) selectedTest = 'mcai_companion:resource_water_regressions'
            if (campGate) selectedTest = 'mcai_companion:camp_regressions'
            if (survivalGate) selectedTest = 'mcai_companion:survival_regressions'
            if (playGate) selectedTest = 'mcai_companion:play_experience_regressions'
            if (structureGate) selectedTest = 'mcai_companion:structure_record_regressions'
            if (excavationGate) selectedTest = 'mcai_companion:excavation_regressions'
            if (respawnGate) selectedTest = 'mcai_companion:respawn_regressions'
            if (dropGate) selectedTest = 'mcai_companion:item_drop_regressions'
            systemProperty 'minepilot.dropTest', Boolean.toString(dropGate)
            if (provenanceGate) selectedTest = 'mcai_companion:provenance_regressions'
            systemProperty 'minepilot.provenanceTest', Boolean.toString(provenanceGate)
            systemProperty 'minepilot.excavationTest', Boolean.toString(excavationGate)
            systemProperty 'minepilot.structureTest', Boolean.toString(structureGate)
            systemProperty 'minepilot.liveNavigationTest',
                Boolean.toString(liveModelGate)
            systemProperty 'minepilot.codexSkillTest',
                Boolean.toString(codexSkillGate)
            systemProperty 'minepilot.navigationRepairTest', Boolean.toString(repairGate)
            systemProperty 'minepilot.knowledgeTest', Boolean.toString(knowledgeGate)
            systemProperty 'minepilot.soundTest', Boolean.toString(soundGate)
            systemProperty 'minepilot.followTest', Boolean.toString(followGate)
            systemProperty 'minepilot.miningTest', Boolean.toString(miningGate)
            systemProperty 'minepilot.collectionTest', Boolean.toString(collectionGate)
            systemProperty 'minepilot.placementTest', Boolean.toString(placementGate)
            args '--tests', selectedTest
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

configurations {
    mcaiForgeApi
    implementation.extendsFrom mcaiForgeApi
}

dependencies {
    mcaiForgeApi minecraft.dependency(
        "net.minecraftforge:forge:26.2-${forgeCompileVersion}"
    )
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar') {
    from('THIRD_PARTY_NOTICES.md')
    from('src/main/java/dev/mcai/companion/vendor/numen') { into 'META-INF/sources/numen' }
    includeEmptyDirs = false
    manifest {
        attributes(
            'MixinConfigs': 'mcai_companion.mixins.json',
            'Specification-Title': 'MinePilot',
            'Specification-Vendor': 'weida',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'weida'
        )
    }
}
