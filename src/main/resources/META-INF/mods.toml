modLoader="javafml"
loaderVersion="[65,66)"
license="Apache-2.0 AND LGPL-3.0-only"

[[mods]]
modId="mcai_companion"
version="0.2.0-dev-mc26.2"
displayName="MinePilot"
authors="weida"
displayTest="IGNORE_SERVER_VERSION"

description='''MinePilot is a server-side AI companion for Minecraft Java Edition.
Players connect with an unmodified Minecraft 26.2 client. Chat and /minepilot_mark
control the companion through vanilla packets; no client mod is required.'''

[[dependencies.mcai_companion]]
    modId="forge"
    mandatory=true
    versionRange="[65.0.0,66)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mcai_companion]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.2]"
    ordering="NONE"
    side="BOTH"
