# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
# There are lots of things you can do with the mods.toml, and not all fields are included with this MDK
# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[65,66)"
license="Apache-2.0"
#clientSideOnly=true #optional, default=false

[[mods]]
modId="mcai_companion"
version="0.2.0-dev-mc26.2"
displayName="MinePilot"
authors="weida"
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''MinePilot is an AI companion for Minecraft Java Edition.
This development build contains the rebuilt headless player body, natural-chat
model encoder, and the first physically executed navigation tool.'''

[[dependencies.mcai_companion]]
    modId="forge"
    mandatory=true
    versionRange="[65.0.0,66)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mcai_companion]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.2]"
    ordering="NONE"
    side="BOTH"
